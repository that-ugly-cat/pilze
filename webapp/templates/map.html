<!doctype html>
<html lang="it"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pilze</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="{{ asset('style.css') }}">
</head><body>
  <button id="panel-toggle" aria-label="menu" title="mostra/nascondi pannello">☰</button>
  <button id="panel-edge" aria-label="mostra/nascondi pannello" title="mostra/nascondi pannello"></button>
  <div id="panel">
    <h1>🍄 Pilze</h1>
    <label>Specie
      <select id="species">
        {% for s in species %}<option value="{{ s.id }}">{{ s.common|capitalize }} — {{ s.scientific }}</option>{% endfor %}
      </select>
    </label>
    <fieldset>
      <label><input type="checkbox" id="l-static" checked> Idoneità statica</label>
      <div id="static-ctl">
        <label class="slabel">Soglia min <span id="cut-val">0.30</span>
          <input type="range" id="cutoff" min="0" max="0.8" step="0.01" value="0.3"></label>
        <label class="slabel">Opacità <span id="op-val">70%</span>
          <input type="range" id="opacity" min="0" max="1" step="0.05" value="0.7"></label>
        <div class="ramp"><span>bassa</span><span class="ramp-bar"></span><span>alta</span></div>
      </div>
      <label><input type="checkbox" id="l-pronte"> Idoneità dinamica</label>
      <div id="pronte-ctl" class="off">
        <label class="slabel">Opacità <span id="pronte-op-val">60%</span>
          <input type="range" id="pronte-op" min="0" max="1" step="0.05" value="0.6"></label>
        <div class="states">
          <span><i style="background:#8ecae6"></i>in fieri</span>
          <span><i style="background:#0077cc"></i>pronto</span>
          <span><i style="background:#2a3a5c"></i>tardi</span>
        </div>
      </div>
      <label><input type="checkbox" id="l-pins" checked> Ritrovamenti</label>
      <label><input type="checkbox" id="l-aoi" checked> Confini area dati</label>
    </fieldset>
    <a class="btnlink" href="/log">✍ Logga un'uscita</a>
    <button id="find-spots" type="button">★ Trova spot migliori</button>
    <label class="near"><input type="checkbox" id="l-near"
      data-home="{{ 1 if home_set else 0 }}"> vicino a me</label>
    <div id="near-ctl" class="off">
      <label class="slabel">Quanti spot <span id="near-k-val">10</span>
        <input type="range" id="near-k" min="0" max="20" step="1" value="10"></label>
      <label class="slabel">Entro <span id="near-km-val">50 km</span>
        <input type="range" id="near-km" min="0" max="100" step="5" value="50"></label>
    </div>
    <p class="hint" id="find-hint">Top 50 per la specie: statica, dinamica o entrambe secondo i layer attivi.</p>
    <div id="status"></div>
    <div class="spacer"></div>
    <div class="foot">
      <a class="pill" href="/me">{{ user.username }}</a>
      <a class="pill" href="/docs">doc</a>
      {% if user.is_admin %}<a class="pill" href="/admin">admin</a>{% endif %}
      <a class="pill" href="/logout">esci</a>
    </div>
  </div>
  <div id="map"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="{{ asset('map.js') }}"></script>
</body></html>
