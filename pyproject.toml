[project]
name = "mappa-funghi"
version = "0.1.0"
description = "Mappa Funghi — idoneità statica × readiness meteo per prevedere le buttate (Veneto+Trentino)"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
bot = ["python-telegram-bot>=21.0"]
gis = ["pyproj>=3.6", "numpy>=1.26", "rasterio>=1.3", "geopandas>=0.14", "xarray>=2024.1"]
meteo = ["requests>=2.31"]   # Open-Meteo per partire; cfgrib/eccodes per i GRIB nativi
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
