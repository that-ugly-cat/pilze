# Pilze su borant — web + bot + poller, una sola immagine, dati come volume.
# Caddy (host) fa da reverse proxy HTTPS verso 127.0.0.1:8790 → pilze.borant.eu.

x-pilze: &pilze
  build: .
  image: pilze:latest
  restart: unless-stopped
  env_file: .env
  environment:
    # Profili VIVI nel volume dati (edit online = fonte di verità, fuori da git).
    # Seed dai default baked al primo avvio (webapp) o dal poller (vedi sotto).
    PILZE_PROFILES_DIR: /app/data/profiles
    # make_map (rigenerazione) resta a 1 core: single-thread + niente thread GDAL/BLAS.
    GDAL_NUM_THREADS: "1"
    OMP_NUM_THREADS: "1"
    OPENBLAS_NUM_THREADS: "1"
    MKL_NUM_THREADS: "1"
  volumes:
    - ./data:/app/data          # mappe (versionate) + DB + foto + profiles/ (vivi)

services:
  web:
    <<: *pilze
    ports:
      - "127.0.0.1:8790:8000"    # porta host 8790 (registro porte borant) → Caddy

  bot:
    <<: *pilze
    command: python -m bot.bot

  poller:
    <<: *pilze
    # ICON-D2 archivia in avanti (§9): fetch giornaliero + ricalcolo "pronte oggi".
    command: >
      sh -c 'python -c "from engine.profiles import seed_profiles; seed_profiles()" || true;
        while true; do
        python -m gis.fetch_meteo --daily boletus_edulis boletus_aestivalis boletus_pinophilus cantharellus_cibarius amanita_caesarea boletus_aereus || true;
        python -m gis.predict_today boletus_edulis boletus_aestivalis boletus_pinophilus cantharellus_cibarius amanita_caesarea boletus_aereus || true;
        sleep 86400;
      done'
