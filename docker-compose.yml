# Pilze su borant — web + bot + poller, una sola immagine, dati come volume.
# Caddy (host) fa da reverse proxy HTTPS verso 127.0.0.1:8790 → pilze.borant.eu.

x-pilze: &pilze
  build: .
  image: pilze:latest
  restart: unless-stopped
  env_file: .env
  environment:
    TZ: Europe/Rome            # schedulazione poller e log in ora locale
    # Profili VIVI nel volume dati (edit online = fonte di verità, fuori da git).
    # Seed dai default baked al primo avvio (webapp) o dal poller (vedi sotto).
    PILZE_PROFILES_DIR: /app/data/profiles
    # make_map (rigenerazione) resta a 1 core: single-thread + niente thread GDAL/BLAS.
    GDAL_NUM_THREADS: "1"
    OMP_NUM_THREADS: "1"
    OPENBLAS_NUM_THREADS: "1"
    MKL_NUM_THREADS: "1"
  volumes:
    - ./data:/app/data          # mappe (versionate) + DB + foto + profiles/ (vivi)

services:
  web:
    <<: *pilze
    ports:
      - "127.0.0.1:8790:8000"    # porta host 8790 (registro porte borant) → Caddy

  poller:
    <<: *pilze
    # ICON-D2 archivia in avanti (§9): fetch giornaliero + ricalcolo "pronte oggi".
    # Specie non elencate: fetch_meteo/predict_today le enumerano dalle mappe presenti
    # (una nuova specie entra da sola). fetch_meteo usa batching multi-località
    # (~45 richieste per l'intera union) → poll in ~1 min, una volta al giorno alle 00:00.
    command: >
      sh -c 'python -c "from engine.profiles import seed_profiles; seed_profiles()" || true;
        while true; do
        python -m gis.fetch_meteo --daily || true;
        python -m gis.predict_today || true;
        sleep $(( $(date -d "00:00 tomorrow" +%s) - $(date +%s) ));
      done'

# Subnet fissata il 19 set 2026. I gateway delle reti Docker finiscono in
# BORANT_TRUSTED_PROXY, e senza un pin dipendono dall'ordine di creazione:
# bastava una risalita in ordine diverso perche' quindici app iniziassero a
# rifiutare le identita' del gate con un 503 che sembra un guasto di auth.
# Le app con repo stanno da 10.200.101.0/24 in su; quelle senza restano non
# fissate nella parte bassa del pool, cosi' non possono rubare uno slot.
networks:
  default:
    ipam:
      config:
        - subnet: 10.200.116.0/24
