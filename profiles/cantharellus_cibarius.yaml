# Profilo specie — Cantharellus cibarius (finferlo, gallinaccio)
# Priori esperti (spec §2). dynamic_triggers = prima passata da rivedere con Spit.
# Ubiquitario e reattivo: segue i temporali estivi con notti fresche (<12 °C).
species:
  id: cantharellus_cibarius
  common_name: finferlo
  trophic_mode: mycorrhizal
  similar_to: []                        # ubiquitario, nessun analogo stretto tra le sei

  # host_genera: pesi [0-1] sui 20 tipi forestali CFI (legenda in config/crosswalk.yaml)
  # ampio spettro (fasi: querce mag–giu → castagno → faggio autunno)
  host_genera:
    faggeta: 0.9
    castagneto: 0.8
    querceto: 0.8
    querceto_rovere: 0.8
    lecceta: 0.8
    pecceta: 0.9              # due raccolti abbondanti in pecceta (Angela, 29-30 lug 2026)
    pecceta_secondaria: 0.7
    abetina: 0.7
    pineta_silvestre: 0.6
    pineta_nera: 0.6
    mugheta: 0.48
    querco_carpineto: 0.48
    latifoglie_sempreverdi: 0.4
    larici_cembreto: 0.24

  static_envelope:
    elevation_m: { min: 300, opt: [600, 1800], max: 2000 }   # ritrovamento a 1816 m
    aspect: cool          # fresca/ombrosa (versanti N), ma ampio
    slope_deg: { opt: [5, 30] }
    soil_ph: acidic       # acido, ricco di humus
    # Era `moist`, scritto quando il fattore non era misurato da nessun layer. Col
    # drenaggio topografico attivo (7 set 2026) il Boyce sull'intorno dice l'opposto:
    # well_drained +0.652, non dichiarare niente +0.592, moist +0.377.
    drainage: well_drained

  extra_static_layers: []
  phenology_months: [5, 6, 7, 8, 9, 10]  # primavera→autunno, picco estate–autunno

  # Tarati il 7 set 2026 sui due ritrovamenti di Angela (29 e 30 lug, entrambi
  # «buono/tanti») e sulle distribuzioni osservate nei mesi di fenologia.
  dynamic_triggers:
    # 14 e non 10: la finestra deve contenere l'innesco della buttata che si valuta, e
    # lag_days arriva a 12. Soglia rialzata per restare allo stesso percentile (~p48).
    rain_window_days: 14
    cumulative_rain_mm: 45
    # I 4 °C stavano al p90 dello shock osservato, e in entrambi i ritrovamenti lo shock
    # era 0.0: a fine luglio il suolo si scalda, chiedere un crollo è chiedere l'autunno.
    thermal_shock_c: 1.5
    soil_temp_c: { min: 8, max: 20 }
    # il ritrovamento #5 è a 3 giorni dall'innesco, con funghi buoni e abbondanti:
    # il finferlo è specie rapida e la finestra si apriva troppo tardi
    lag_days: { opt: [3, 12] }
    # NON toccato: al p75 dell'umidità osservata è la soglia più severa rimasta, ma
    # nessuno dei due ritrovamenti la falsifica (passava a 0.299 e 0.296).
    moisture_floor: 0.25
