# Profilo specie — Amanita caesarea (ovolo)
# Priori esperti (spec §2). dynamic_triggers = prima passata da rivedere con Spit.
species:
  id: amanita_caesarea
  common_name: ovolo
  trophic_mode: mycorrhizal
  similar_to: [boletus_aereus]         # condivide la nicchia termofila

  # host_genera: pesi [0-1] sui 20 tipi forestali CFI (legenda in config/crosswalk.yaml)
  host_genera:
    castagneto: 1.0
    querceto: 0.7
    querceto_rovere: 0.7
    lecceta: 0.7
    querco_carpineto: 0.58
    latifoglie_sempreverdi: 0.55
    orno_ostrieto: 0.4
    acero_frassineto: 0.4
    formazione_marginale: 0.4
    frassineto: 0.2
    alneto: 0.12
    altre_latifoglie: 0.12
    # NB: NON faggeta (spec §2) — assente dal profilo host

  static_envelope:
    elevation_m: { min: 200, opt: [300, 700], max: 900 }   # al nord ~700–800; max ~1000
    aspect: warm         # radure assolate e ventilate
    slope_deg: { opt: [3, 25] }
    soil_ph: tolerant    # acido e carbonatico, meglio siliceo
    drainage: well_drained

  extra_static_layers: []
  phenology_months: [7, 8, 9]          # estate, picco agosto (NON autunnale)

  # Tarati il 7 set 2026 sulle distribuzioni osservate nei mesi dell'ovolo (lug-set).
  # Nessuna osservazione di campo per questa specie: si correggono solo i due difetti
  # oggettivi, non si tocca ciò che è già dentro la distribuzione.
  dynamic_triggers:
    # 20 e non 12: la finestra deve contenere l'innesco della buttata che si valuta, e il
    # lag arriva a 16. Con 12 la pioggia d'innesco usciva dalla finestra proprio nei
    # giorni in cui la specie sarebbe dovuta essere pronta.
    rain_window_days: 20
    cumulative_rain_mm: 65      # stesso percentile (~p45) dei vecchi 35 mm su 12 gg
    # i 4 °C stavano al p90 dello shock osservato ed erano il primo veto (32% delle
    # celle-giorno bloccate). Per una specie di piena estate un crollo del suolo non è
    # il meccanismo: la buttata viene dalla pioggia su suolo caldo.
    thermal_shock_c: 1.5
    # NON toccati: misurati dentro la distribuzione dei suoi mesi, sono gli unici due
    # parametri della collezione scritti bene la prima volta.
    soil_temp_c: { min: 15, max: 26 }    # copre il 77% delle celle-giorno
    lag_days: { opt: [10, 16] }          # raggiungibile un giorno su sei
    moisture_floor: 0.18                 # p45 dell'umidità osservata
