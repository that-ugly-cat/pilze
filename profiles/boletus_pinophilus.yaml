# Profilo specie — Boletus pinophilus (porcino rosso)
# Priori esperti (spec §2). dynamic_triggers = prima passata da rivedere con Spit.
# Nota: favorito da shock termico (grandinate) → thermal_shock_c alto.
species:
  id: boletus_pinophilus
  common_name: porcino rosso
  trophic_mode: mycorrhizal
  similar_to: [boletus_edulis]

  # host_genera: pesi [0-1] sui 20 tipi forestali CFI (legenda in config/crosswalk.yaml)
  host_genera:
    pineta_silvestre: 1.0
    pineta_nera: 1.0
    pecceta: 0.9
    pecceta_secondaria: 0.9
    abetina: 0.9
    mugheta: 0.8
    faggeta: 0.6
    larici_cembreto: 0.4      # larice NON host, ma il cembro sì → peso ridotto
    castagneto: 0.4

  static_envelope:
    elevation_m: { min: 1000, opt: [1200, 1800], max: 2000 }
    aspect: cool         # fresca, ombrosa
    slope_deg: { opt: [10, 35] }        # zone ripide, con mirtillo
    soil_ph: acidic      # siliceo/acido
    drainage: well_drained

  extra_static_layers: []
  phenology_months: [4, 5, 6, 9, 10]   # primavera + autunno (multi-finestra); montano fresco anche estate

  # Tarati il 7 set 2026 sul ritrovamento di Angela (6 set, Cima d'Asta, «buono/pochi»)
  # e sulle distribuzioni osservate. Coi valori vecchi quella cella dava readiness 0.0,
  # vetata da tre soglie insieme.
  dynamic_triggers:
    # 25 e non 12: con la finestra corta l'innesco (12 giorni prima) restava fuori e la
    # cella vedeva 12 mm invece di 78. La finestra deve coprire il lag, che arriva a 20.
    rain_window_days: 25
    # 75 e non 40: sulla finestra nuova il ritrovamento sta a 78 mm. È più permissivo del
    # p72 di prima — è il dato di campo a imporlo, non un'analogia.
    cumulative_rain_mm: 75
    # i 6 °C stavano al percentile 100: mai raggiunti in tutta la stagione osservata
    # (p95 = 2.9). Era un veto permanente travestito da soglia.
    thermal_shock_c: 1.5
    soil_temp_c: { min: 7, max: 16 }     # non toccato: 15.9 °C al ritrovamento, in banda
    lag_days: { opt: [12, 20] }          # non toccato: dst = 12 al ritrovamento
    # 0.12 come per l'edulis: al ritrovamento l'umidità era 0.148, quindi 0.22 è
    # falsificato. Da discriminante a rete anti-siccità.
    moisture_floor: 0.12
