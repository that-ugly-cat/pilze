# Profilo specie — Boletus aestivalis / reticulatus (estatino, fiorone)
# Priori esperti (spec §2). dynamic_triggers = prima passata da rivedere con Spit.
species:
  id: boletus_aestivalis
  common_name: estatino
  trophic_mode: mycorrhizal
  similar_to: [boletus_aereus, boletus_edulis]

  # host_genera: pesi [0-1] sui 20 tipi forestali CFI (legenda in config/crosswalk.yaml)
  host_genera:
    castagneto: 1.0
    querceto: 0.8
    querceto_rovere: 0.8
    lecceta: 0.8
    faggeta: 0.6
    querco_carpineto: 0.6
    latifoglie_sempreverdi: 0.55
    orno_ostrieto: 0.3
    acero_frassineto: 0.3
    formazione_marginale: 0.3
    pecceta: 0.2
    pecceta_secondaria: 0.2
    abetina: 0.2
    frassineto: 0.15
    alneto: 0.09
    altre_latifoglie: 0.09

  static_envelope:
    elevation_m: { min: 200, opt: [300, 1000], max: 1500 }
    aspect: neutral       # versanti semi-ombrosi, esposizione media
    slope_deg: { opt: [5, 30] }
    soil_ph: tolerant     # da siliceo a mediamente calcareo
    drainage: well_drained

  extra_static_layers: []
  phenology_months: [5, 6, 7, 8, 9]    # il più precoce: da metà maggio, per tutta l'estate

  dynamic_triggers:       # PROVVISORI (oltre l'esempio spec) — da tarare
    # finestra allargata oltre il lag massimo: con la vecchia, l'innesco usciva
    # dalla finestra proprio quando la specie sarebbe dovuta essere pronta.
    # Soglia rialzata allo STESSO percentile: la severita' non cambia.
    rain_window_days: 20
    cumulative_rain_mm: 51
    # i 4 gradi stavano al p90 dello shock osservato nei mesi della specie:
    # una soglia in cima alla distribuzione e' un veto, non un criterio. 1.5 = mediana.
    thermal_shock_c: 1.5
    soil_temp_c: { min: 13, max: 24 }
    lag_days: { opt: [8, 15] }          # precoce / reattivo
    moisture_floor: 0.18
