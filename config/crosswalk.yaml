# Crosswalk forestale (spec §3.3) — categoria CFI2020 → CLASSE HOST (mappatura 1:1).
#
# Da giugno 2026 le classi host sono le 20 categorie forestali CFI stesse (nomi
# leggibili), non più 8 generi collassati: un profilo di specie pesa direttamente
# ogni tipo di bosco (es. pecceta ≠ abetina, mugheta ≠ pineta_silvestre). Ogni cella
# ha UNA categoria Ct_CFI → host_membership è un lookup diretto del peso nel profilo.
#
# CFI2020 nazionale (campo Ct_CFI, codici 2 lettere) — legenda UNICA VE+Trento+Bolzano,
# copertura completa del bosco. Fra parentesi il codice INFC di raggruppamento.

target_classes:
  - pecceta                # PE  abete rosso (INFC 2)
  - pecceta_secondaria     # PF  abete rosso, sottotipo CFI (INFC 2)
  - abetina                # AB  abete bianco (INFC 3)
  - larici_cembreto        # LC  larice + cembro (INFC 1)
  - faggeta                # FA  faggio (INFC 8)
  - mugheta                # MU  pino mugo (INFC 21)
  - pineta_silvestre       # PS  pino silvestre (INFC 4/5)
  - pineta_nera            # PN  pino nero (INFC 5)
  - castagneto             # CA  castagno (INFC 11)
  - querceto               # QV  querce (INFC 9/10)
  - querceto_rovere        # QR  rovere (INFC 9)
  - querco_carpineto       # QC  querce + carpino (INFC 12)
  - orno_ostrieto          # OS  orniello + carpino nero (INFC 12)
  - lecceta                # LE  leccio (INFC 15)
  - acero_frassineto       # AF  acero + frassino (INFC 14)
  - frassineto             # FR  frassino / ripariale (INFC 13)
  - alneto                 # AL  ontano (INFC 14)
  - altre_latifoglie       # AN  igrofile / altre latifoglie (INFC 13/21)
  - latifoglie_sempreverdi # LS  sempreverdi (INFC 17)
  - formazione_marginale   # AM  marginale (INFC 3)

# Ct_CFI → { classe host: 1.0 } (1-hot: ogni categoria È una classe).
cfi:
  PE: { pecceta: 1.0 }
  PF: { pecceta_secondaria: 1.0 }
  AB: { abetina: 1.0 }
  LC: { larici_cembreto: 1.0 }
  FA: { faggeta: 1.0 }
  MU: { mugheta: 1.0 }
  PS: { pineta_silvestre: 1.0 }
  PN: { pineta_nera: 1.0 }
  CA: { castagneto: 1.0 }
  QV: { querceto: 1.0 }
  QR: { querceto_rovere: 1.0 }
  QC: { querco_carpineto: 1.0 }
  OS: { orno_ostrieto: 1.0 }
  LE: { lecceta: 1.0 }
  AF: { acero_frassineto: 1.0 }
  FR: { frassineto: 1.0 }
  AL: { alneto: 1.0 }
  AN: { altre_latifoglie: 1.0 }
  LS: { latifoglie_sempreverdi: 1.0 }
  AM: { formazione_marginale: 1.0 }
