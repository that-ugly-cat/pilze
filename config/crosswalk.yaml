# Crosswalk forestale (spec §3.3) — legende regionali → composizione di generi ospite.
#
# Ogni categoria della carta forestale è mappata su una COMPOSIZIONE {genere: peso}
# (i pesi ~ quota della categoria coperta da quel genere). Il motore calcola
# l'appartenenza ospite come prodotto scalare fra questa composizione e gli host_genera
# del profilo di specie (engine.static_scorer.host_membership).
#
# Classi target (chiuse):
#   querce | castagno | faggio | abete | pino | altro_latifoglie | altro_conifere | non_forestale
#
# VENETO   (campo CATEGORIA): Carta Regionale dei Tipi Forestali, 18 categorie, EPSG:3003.
# TRENTINO (campo tipo_fores): Tipi forestali - SIGFAT, 54 tipi, EPSG:25832; mappa generata
#          da un classificatore a parole-chiave sui nomi (primario + "con X"), da rivedere.
# Opzione futura (opzionale): CFI2020 nazionale (MASAF) → legenda UNICA per VE+TN.
#
# Nota (spec §2): larice NON è ospite dei porcini → mappato su altro_conifere (peso basso);
# robinia/ontano non sono ospiti micorrizici → non_forestale / altro_latifoglie basso.

target_classes:
  - querce
  - castagno
  - faggio
  - abete
  - pino
  - altro_latifoglie
  - altro_conifere
  - non_forestale

# --- VENETO: campo CATEGORIA ---
veneto:
  Faggete:                                         { faggio: 1.0 }
  Peccete:                                         { abete: 1.0 }        # anche bersaglio Vaia/bostrico
  Abieteti:                                        { abete: 1.0 }        # abete bianco
  Piceo-faggeti:                                   { abete: 0.5, faggio: 0.5 }
  Pinete di pino silvestre:                        { pino: 1.0 }
  Mughete:                                         { pino: 0.8, altro_conifere: 0.2 }   # pino mugo
  Lariceti e larici-cembreti:                      { altro_conifere: 0.6, pino: 0.4 }   # larice (NON host) + cembro
  Castagneti e rovereti:                           { castagno: 0.6, querce: 0.4 }
  Querco-carpineti e carpineti:                    { querce: 0.6, altro_latifoglie: 0.4 }  # carpino
  Orno-ostrieti e ostrio-querceti:                 { querce: 0.4, altro_latifoglie: 0.6 }  # orniello/carpino nero
  Formazioni euganee con elementi mediterranei:    { querce: 0.6, altro_latifoglie: 0.4 }  # leccio/roverella
  Aceri-frassineti e aceri-tiglieti:               { altro_latifoglie: 1.0 }
  Betuleti:                                        { altro_latifoglie: 1.0 }
  Saliceti e altre formazioni riparie:             { altro_latifoglie: 0.3 }
  Alnete:                                          { altro_latifoglie: 0.3 }
  Formazioni costiere:                             { pino: 0.3 }
  Arbusteti:                                       { non_forestale: 1.0 }
  Formazioni antropogene:                          { non_forestale: 1.0 }

